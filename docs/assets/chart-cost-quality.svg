<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="t d" class="viz">
<title id="t">Cost vs prompts passed</title><desc id="d">Scatter of three configurations: Router 68 passed at ₹3.14; Always-frontier (GLM-5.3) 61 passed at ₹26.57; Always-cheapest (conversations) 63 passed at ₹0.32</desc>
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e1;
         --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f;
           --s1:#3987e5; --s2:#d95926; --s3:#199e70; } }
  text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t { font-size:15px; font-weight:600; } .st { font-size:12px; fill: var(--ink2); }
  .ax { font-size:11px; fill: var(--ink2); } .lab { font-size:11px; fill: var(--ink); }
  .note { font-size:10.5px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width:1; } .base { stroke: var(--muted); stroke-width:1; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); } .sn { fill: var(--ink2); }
  .ring { stroke: var(--surface); stroke-width:2; }
</style>
<rect width="720" height="390" rx="8" style="fill:var(--surface)"/>
<text x="24" y="30" class="t">Router: more prompts passed, for about a tenth of the frontier cost</text>
<text x="24" y="50" class="st">75 live prompts. Up and to the left is better. Cost axis is logarithmic.</text>
<line x1="70.0" y1="70" x2="70.0" y2="324" class="grid"/><text x="70.0" y="340" text-anchor="middle" class="ax">₹0.1</text>
<line x1="273.3" y1="70" x2="273.3" y2="324" class="grid"/><text x="273.3" y="340" text-anchor="middle" class="ax">₹1</text>
<line x1="476.7" y1="70" x2="476.7" y2="324" class="grid"/><text x="476.7" y="340" text-anchor="middle" class="ax">₹10</text>
<line x1="680.0" y1="70" x2="680.0" y2="324" class="grid"/><text x="680.0" y="340" text-anchor="middle" class="ax">₹100</text>
<line x1="70" y1="324.0" x2="680" y2="324.0" class="grid"/><text x="62" y="328.0" text-anchor="end" class="ax">50</text>
<line x1="70" y1="273.2" x2="680" y2="273.2" class="grid"/><text x="62" y="277.2" text-anchor="end" class="ax">55</text>
<line x1="70" y1="222.4" x2="680" y2="222.4" class="grid"/><text x="62" y="226.4" text-anchor="end" class="ax">60</text>
<line x1="70" y1="171.6" x2="680" y2="171.6" class="grid"/><text x="62" y="175.6" text-anchor="end" class="ax">65</text>
<line x1="70" y1="120.8" x2="680" y2="120.8" class="grid"/><text x="62" y="124.8" text-anchor="end" class="ax">70</text>
<line x1="70" y1="70.0" x2="680" y2="70.0" class="grid"/><text x="62" y="74.0" text-anchor="end" class="ax">75</text>
<text x="375.0" y="372" text-anchor="middle" class="ax">Cost for 75 requests (₹, log scale)</text><text x="18" y="197.0" transform="rotate(-90 18 197.0)" text-anchor="middle" class="ax">Prompts passed (of 75)</text>
<circle cx="374.4" cy="141.1" r="7" class="s1 ring"/><text x="388.4" y="137.1" text-anchor="start" class="lab" font-weight="600">Router</text><text x="388.4" y="152.1" text-anchor="start" class="ax">68 passed · ₹3.14</text>
<circle cx="563.0" cy="212.2" r="7" class="s2 ring"/><text x="549.0" y="208.2" text-anchor="end" class="lab" font-weight="600">Always-frontier (GLM-5.3)</text><text x="549.0" y="223.2" text-anchor="end" class="ax">61 passed · ₹26.57</text>
<circle cx="171.5" cy="191.9" r="7" class="s3 ring"/><text x="185.5" y="187.9" text-anchor="start" class="lab" font-weight="600">Always-cheapest (conversations)</text><text x="185.5" y="202.9" text-anchor="start" class="ax">63 passed · ₹0.32</text>
<text x="24" y="386" class="note">Router: 68 in the full run; 70 counting the two fixes verified afterwards (u49, u61).</text>

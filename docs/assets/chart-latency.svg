<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d" class="viz">
<title id="t">Latency by configuration</title><desc id="d">Grouped bars of p50, p95 and live-voice p95 latency in seconds.</desc>
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e1;
         --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f;
           --s1:#3987e5; --s2:#d95926; --s3:#199e70; } }
  text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t { font-size:15px; font-weight:600; } .st { font-size:12px; fill: var(--ink2); }
  .ax { font-size:11px; fill: var(--ink2); } .lab { font-size:11px; fill: var(--ink); }
  .note { font-size:10.5px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width:1; } .base { stroke: var(--muted); stroke-width:1; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); } .sn { fill: var(--ink2); }
  .ring { stroke: var(--surface); stroke-width:2; }
</style>
<rect width="720" height="360" rx="8" style="fill:var(--surface)"/>
<text x="24" y="30" class="t">Latency: the router is as fast as the cheapest model on live calls</text>
<text x="24" y="50" class="st">Seconds, model time only (speech-to-text not included). Dashed line: 1.5 s voice target.</text>
<rect x="24" y="63" width="10" height="10" rx="2" class="s1"/><text x="39" y="72" class="ax">Router</text><rect x="83.8" y="63" width="10" height="10" rx="2" class="s2"/><text x="98.8" y="72" class="ax">Always-frontier (GLM-5.3)</text><rect x="263.3" y="63" width="10" height="10" rx="2" class="s3"/><text x="278.3" y="72" class="ax">Always-cheapest (conversations)</text>
<line x1="60" y1="300.0" x2="690" y2="300.0" class="grid"/><text x="52" y="304.0" text-anchor="end" class="ax">0 s</text>
<line x1="60" y1="264.3" x2="690" y2="264.3" class="grid"/><text x="52" y="268.3" text-anchor="end" class="ax">5 s</text>
<line x1="60" y1="228.7" x2="690" y2="228.7" class="grid"/><text x="52" y="232.7" text-anchor="end" class="ax">10 s</text>
<line x1="60" y1="193.0" x2="690" y2="193.0" class="grid"/><text x="52" y="197.0" text-anchor="end" class="ax">15 s</text>
<line x1="60" y1="157.3" x2="690" y2="157.3" class="grid"/><text x="52" y="161.3" text-anchor="end" class="ax">20 s</text>
<line x1="60" y1="121.7" x2="690" y2="121.7" class="grid"/><text x="52" y="125.7" text-anchor="end" class="ax">25 s</text>
<line x1="60" y1="86.0" x2="690" y2="86.0" class="grid"/><text x="52" y="90.0" text-anchor="end" class="ax">30 s</text>
<line x1="60" y1="289.3" x2="690" y2="289.3" style="stroke:var(--ink2)" stroke-dasharray="4 3"/>

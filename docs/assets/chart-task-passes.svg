<title id="t">Pass rate by task type</title><desc id="d">Grouped bars: pass rate for each task type for the router and both baselines.</desc>
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e1;
